baseURL: https://orkura.github.io/
languageCode: zh-cn
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
title: Orkura
theme: PaperMod

hasCJKLanguage: true
enableRobotsTXT: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: Orkura
  description: "分享知识，交流经验"
  author: Orkura
  dateFormat: "2006-01-02"

  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  hideFooter: true

  showReadingTime: true
  showWordCount: true
  showToc: true
  tocOpen: true
  showCodeCopyButtons: true
  showPostNavLinks: true
  showBreadCrumbs: true
  showRssButtonInSectionTermList: true
  enablePetalRain: true

  homeInfoParams:
    title: 《劝学》
    content: |
      吾尝终日而思矣，不如须臾之所学也；  
      吾尝跂而望矣，不如登高之博见也。

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - identifier: tech
      name: 技术交流
      pageRef: /tech
      weight: 10

    - identifier: projects
      name: 项目经历
      pageRef: /projects
      weight: 20

    - identifier: essays
      name: 个人随笔
      pageRef: /essays
      weight: 30

    - identifier: about
      name: 个人介绍
      pageRef: /about
      weight: 40
