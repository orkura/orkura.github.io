baseURL: https://orkura.github.io/
languageCode: zh-cn
defaultContentLanguage: zh-cn
timeZone: Asia/Shanghai
title: Orkura
theme: PaperMod

hasCJKLanguage: true
enableRobotsTXT: true

pagination:
  pagerSize: 10

taxonomies:
  category: categories
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: Orkura
  description: "记录软件开发、嵌入式系统与工程实践"
  author: Orkura
  dateFormat: "2006-01-02"

  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true

  showReadingTime: true
  showWordCount: true
  showToc: true
  tocOpen: true
  showCodeCopyButtons: true
  showPostNavLinks: true
  showBreadCrumbs: true
  showRssButtonInSectionTermList: true

  homeInfoParams:
    title: Orkura
    content: "记录技术探索、开发实践与问题解决过程。"

  socialIcons:
    - name: github
      url: https://github.com/orkura

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

caches:
  images:
    dir: :cacheDir/images
